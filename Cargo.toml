[package]
name = "godot-zx"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"

[lib]
crate-type = ["cdylib"]

[dependencies.godot]
# Versão oficial fixa do crates.io. Não usar o branch master: a partir de 2026-09-20 deixou de compilar para wasm32.
# Para atualizar: mudar a versão, correr os builds (incluindo o Web) e testar no Godot.
version = "=0.5.5"
features = ["experimental-wasm", "lazy-function-tables"]

[dependencies]
rustzx-core = { version = "0.16.0", features = ["sound", "ay", "autoload", "embedded-roms", "full"] }
rustzx-z80 = "0.16.0"

[features]
nothreads = ["godot/experimental-wasm-nothreads"]

[profile.release]
panic = "abort"
opt-level = 3
strip = true
lto = true
