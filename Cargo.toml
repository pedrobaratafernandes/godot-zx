[package]
name = "godot-zx"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"

[lib]
crate-type = ["cdylib"]

[dependencies.godot]
# Versão oficial fixa do crates.io. Não usar o branch master: a partir de 2026-09-20 deixou de compilar para wasm32.
# Para atualizar: mudar a versão, correr os builds (incluindo o Web) e testar no Godot.
version = "=0.5.5"
features = ["experimental-wasm", "lazy-function-tables"]

[dependencies]
# Fork do ArjunNair (base 0.16.0 + suporte TZX e SZX). Fixado num commit para builds reprodutíveis.
rustzx-core = { git = "https://github.com/ArjunNair/rustzx", rev = "b169492968ebc11ec9b6276b6ad6f92bce6154ef", features = ["sound", "ay", "autoload", "embedded-roms", "full"] }
rustzx-z80 = { git = "https://github.com/ArjunNair/rustzx", rev = "b169492968ebc11ec9b6276b6ad6f92bce6154ef" }

[dev-dependencies]
# Only used by the tests to build zlib-compressed SZX snapshots (same crate rustzx-core uses to read them).
miniz_oxide = "0.7"

[features]
nothreads = ["godot/experimental-wasm-nothreads"]

[profile.release]
panic = "abort"
opt-level = 3
strip = true
lto = true

# The tests emulate minutes of Spectrum time; without optimisation they are ~20x slower.
[profile.test]
opt-level = 3
