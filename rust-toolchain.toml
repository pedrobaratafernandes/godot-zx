# Versão fixa do Rust para TODOS os builds (Linux, Windows e Web).
# Para atualizar: mudar a versão, correr os scripts de build e testar no Godot.
# O build Web usa RUSTC_BOOTSTRAP=1 para permitir -Zbuild-std neste Rust estável.
[toolchain]
channel = "1.97.1"
profile = "minimal"
components = ["rust-src"]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-gnu", "wasm32-unknown-emscripten"]
